<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Manrope:wght@500;700&amp;family=Noto+Sans+Devanagari:wght@500;700&amp;display=swap');
      
      .title { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #ffffff; }
      .text { font-family: 'Manrope', sans-serif; font-weight: 500; fill: #efefef; }
      .muted { font-family: 'Manrope', sans-serif; font-weight: 700; fill: #6b7280; text-transform: uppercase; letter-spacing: 1.5px; }
      .hindi { font-family: 'Noto Sans Devanagari', sans-serif; font-weight: 700; fill: #ffffff; }
    </style>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111508"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Sleek silver/dark graphite iPhone Bezel -->
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4f5c"/>
      <stop offset="25%" stop-color="#0f1118"/>
      <stop offset="75%" stop-color="#07080a"/>
      <stop offset="100%" stop-color="#3f4552"/>
    </linearGradient>

    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Deep High-Contrast Presentation Backdrop -->
  <rect width="1200" height="800" fill="url(#bg-glow)"/>

  <!-- Presentation Pedestal Shadow -->
  <ellipse cx="600" cy="760" rx="350" ry="20" fill="#000000" opacity="0.6" filter="blur(15px)"/>

  <!-- Phone Geometry -->
  <g transform="translate(420, 30)" filter="url(#drop-shadow)">
    <!-- Outer Bezel -->
    <rect width="360" height="740" rx="55" fill="url(#bezel)"/>
    <!-- Inner Screen Canvas -->
    <rect x="8" y="8" width="344" height="724" rx="48" fill="#08090a"/>
    
    <!-- Dynamic Island -->
    <rect x="120" y="20" width="120" height="30" rx="15" fill="#000000"/>
    <circle cx="215" cy="35" r="4" fill="#0a0a0a"/>

    <g transform="translate(8, 8)">
      <!-- App Header Bar -->
      <path d="M 0 48 Q 0 0 48 0 L 296 0 Q 344 0 344 48 L 344 95 L 0 95 Z" fill="#0f1116"/>
      <text x="172" y="75" class="title" font-size="20" text-anchor="middle">Akshara Mobile</text>

      <!-- Scanning Viewport -->
      <rect x="22" y="115" width="300" height="350" rx="20" fill="#14171d" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      
      <!-- Abstract Image of Document -->
      <rect x="52" y="145" width="240" height="290" fill="#ffffff" rx="6" opacity="0.03"/>
      <!-- Text lines spanning document heavily abstract -->
      <rect x="72" y="185" width="160" height="12" rx="6" fill="#fff" opacity="0.08"/>
      <rect x="72" y="215" width="200" height="12" rx="6" fill="#fff" opacity="0.08"/>
      <rect x="72" y="245" width="180" height="12" rx="6" fill="#fff" opacity="0.08"/>
      <rect x="72" y="325" width="140" height="12" rx="6" fill="#fff" opacity="0.08"/>
      
      <!-- Neon Scanner Binding Box -->
      <path d="M 40 135 L 40 125 L 50 125" fill="none" stroke="#c6f135" stroke-width="3.5"/>
      <path d="M 294 125 L 304 125 L 304 135" fill="none" stroke="#c6f135" stroke-width="3.5"/>
      <path d="M 304 445 L 304 455 L 294 455" fill="none" stroke="#c6f135" stroke-width="3.5"/>
      <path d="M 50 455 L 40 455 L 40 445" fill="none" stroke="#c6f135" stroke-width="3.5"/>



      <!-- NLP Output Box -->
      <rect x="22" y="485" width="300" height="115" rx="16" fill="#181a21"/>
      <text x="42" y="515" class="muted" font-size="11">Extracted Payload (Hindi)</text>
      <!-- Real High-Contrast Hindi Output -->
      <text x="42" y="555" class="hindi" font-size="28" fill="#c6f135">अक्षर ओसीआर</text>
      <text x="42" y="582" class="hindi" font-size="17" opacity="0.85">भारत की प्राचीन तकनीक</text>

      <!-- Primary Extraction Action -->
      <rect x="22" y="625" width="300" height="60" rx="16" fill="#c6f135"/>
      <text x="172" y="661" font-family="'Outfit', sans-serif" font-weight="700" font-size="18" fill="#000000" text-anchor="middle">Capture &amp; Execute</text>
      
      <!-- iOS Home Handle -->
      <rect x="112" y="705" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- Presentation Hooks / Arrows for GitHub Splash -->
  <g transform="translate(190, 360)">
    <path d="M 120 0 L 220 0 L 250 50" fill="none" stroke="#c6f135" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="250" cy="50" r="4" fill="#c6f135"/>
    <text x="100" y="-10" class="title" font-size="34" text-anchor="end">Offline WASM</text>
    <text x="100" y="24" class="muted" font-size="14" text-anchor="end">ON-DEVICE HYBRID INFERENCE</text>
  </g>

  <g transform="translate(1010, 520)">
    <path d="M -120 0 L -220 0 L -250 -40" fill="none" stroke="#c6f135" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="-250" cy="-40" r="4" fill="#c6f135"/>
    <text x="-100" y="-10" class="title" font-size="34" text-anchor="start">Trie Checking</text>
    <text x="-100" y="24" class="muted" font-size="14" text-anchor="start">ADVANCED NLP LINGUISTICS</text>
  </g>
</svg>
