<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Manrope:wght@500;700&amp;family=Noto+Sans+Devanagari:wght@500;700&amp;display=swap');
      
      .title { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #ffffff; }
      .text { font-family: 'Manrope', sans-serif; font-weight: 500; fill: #efefef; }
      .muted { font-family: 'Manrope', sans-serif; font-weight: 700; fill: #6b7280; text-transform: uppercase; letter-spacing: 1.5px; }
      .hindi { font-family: 'Noto Sans Devanagari', sans-serif; font-weight: 500; fill: #ffffff; }
    </style>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4f5c"/>
      <stop offset="25%" stop-color="#0f1118"/>
      <stop offset="75%" stop-color="#07080a"/>
      <stop offset="100%" stop-color="#3f4552"/>
    </linearGradient>

    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-glow)"/>
  <ellipse cx="600" cy="760" rx="350" ry="20" fill="#000000" opacity="0.6" filter="blur(15px)"/>

  <!-- Phone Geometry -->
  <g transform="translate(420, 30)" filter="url(#drop-shadow)">
    <rect width="360" height="740" rx="55" fill="url(#bezel)"/>
    <rect x="8" y="8" width="344" height="724" rx="48" fill="#08090a"/>
    
    <rect x="120" y="20" width="120" height="30" rx="15" fill="#000000"/>
    
    <g transform="translate(8, 8)">
      <!-- App Header -->
      <path d="M 0 48 Q 0 0 48 0 L 296 0 Q 344 0 344 48 L 344 95 L 0 95 Z" fill="#0f1116"/>
      <text x="172" y="75" class="title" font-size="20" text-anchor="middle">Extraction History</text>

      <!-- History Items -->
      <g transform="translate(20, 120)">
        <!-- Item 1 -->
        <rect width="304" height="100" rx="16" fill="#14171d"/>
        <text x="20" y="35" class="muted" font-size="11">2 minutes ago</text>
        <text x="20" y="65" class="hindi" font-size="22">अक्षर ओसीआर</text>
        <rect x="230" y="25" width="55" height="22" rx="11" fill="rgba(198, 241, 53, 0.15)"/>
        <text x="257.5" y="40" font-family="'Manrope', sans-serif" font-weight="700" font-size="10" fill="#c6f135" text-anchor="middle">DONE</text>
        
        <!-- Item 2 -->
        <g transform="translate(0, 115)">
          <rect width="304" height="100" rx="16" fill="#14171d"/>
          <text x="20" y="35" class="muted" font-size="11">1 hour ago</text>
          <text x="20" y="65" class="hindi" font-size="22">प्राचीन लिपियाँ</text>
          <rect x="230" y="25" width="55" height="22" rx="11" fill="rgba(198, 241, 53, 0.15)"/>
          <text x="257.5" y="40" font-family="'Manrope', sans-serif" font-weight="700" font-size="10" fill="#c6f135" text-anchor="middle">DONE</text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(0, 230)">
          <rect width="304" height="100" rx="16" fill="#14171d"/>
          <text x="20" y="35" class="muted" font-size="11">Yesterday</text>
          <text x="20" y="65" class="hindi" font-size="22">डिजिटल भारत</text>
          <rect x="230" y="25" width="55" height="22" rx="11" fill="rgba(198, 241, 53, 0.15)"/>
          <text x="257.5" y="40" font-family="'Manrope', sans-serif" font-weight="700" font-size="10" fill="#c6f135" text-anchor="middle">DONE</text>
        </g>
      </g>

      <!-- Bottom Navigation -->
      <rect y="640" width="344" height="84" fill="#0f1116"/>
      <g transform="translate(50, 675)">
        <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.05)"/>
        <rect x="-8" y="-8" width="16" height="16" stroke="#8b92a5" stroke-width="1.5" fill="none"/>
        
        <g transform="translate(122, 0)">
          <circle cx="0" cy="0" r="25" fill="#c6f135"/>
          <path d="M -10 0 L 10 0 M 0 -10 L 0 10" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
        </g>
        
        <g transform="translate(244, 0)">
          <circle cx="0" cy="0" r="20" fill="rgba(198, 241, 53, 0.1)"/>
          <rect x="-8" y="-8" width="16" height="16" stroke="#c6f135" stroke-width="2" fill="none"/>
        </g>
      </g>
      
      <rect x="112" y="705" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
    </g>
  </g>
</svg>
