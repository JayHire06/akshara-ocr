name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/akshara-ocr
            git pull origin main
            docker-compose build
            docker-compose pull
            docker-compose up -d
      - name: Run integration tests and rollback on failure
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/akshara-ocr
            docker-compose run --rm api pytest tests/integration/ || (
              echo "Integration tests failed. Rolling back..."
              # Simplified rollback logic: returning to previous state
              git checkout HEAD@{1}
              docker-compose up -d --build
              exit 1
            )

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/akshara-ocr
            git fetch --tags
            git checkout ${{ github.ref_name }}
            docker-compose build
            docker-compose pull
            docker-compose up -d
      - name: Run integration tests and rollback on failure
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/akshara-ocr
            docker-compose run --rm api pytest tests/integration/ || (
              echo "Integration tests failed. Rolling back..."
              # Rollback to the previous tag
              PREV_TAG=$(git describe --abbrev=0 --tags HEAD^)
              git checkout $PREV_TAG
              docker-compose up -d --build
              exit 1
            )
