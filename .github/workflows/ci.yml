name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install flake8 black
      - name: Run lint
        run: |
          flake8 api preprocess model nlp --exit-zero
          black api preprocess model nlp

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic \
            celery redis python-multipart passlib bcrypt "python-jose[cryptography]" \
            prometheus-client Pillow numpy onnxruntime \
            pytest pytest-cov pytest-asyncio httpx pytest-mock requests
      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/integration --exit-zero

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: Build Docker compose services
        run: docker-compose build
      - name: Verify services start without errors
        run: |
          docker-compose up -d
          # Wait for services to be up
          sleep 10
          # Check if container is running or exited with failure
          if docker-compose ps | grep "Exit \([1-9]\|[0-9]\{2,\}\)"; then docker-compose logs; exit 1; fi
          docker-compose down

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit on Python code
        run: bandit -r api preprocess model nlp --severity-level high
      - name: Build Docker image for trivy
        run: docker build -t akshara-api:latest .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'akshara-api:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
