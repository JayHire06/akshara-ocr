version: "3.8"

services:
  api:
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - RELOAD=1
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  model-server:
    volumes:
      - .:/app
    environment:
      - DEBUG=1
    command: uvicorn api.model_server:app --host 0.0.0.0 --port 8001 --reload

  celery-worker:
    volumes:
      - .:/app
    environment:
      - DEBUG=1
